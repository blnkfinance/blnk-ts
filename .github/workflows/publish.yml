name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish @blnkfinance/blnk-typescript
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

      - name: Run linter
        run: npm run lint

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Smoke test packed tarball
        run: |
          npm pack
          TARBALL=$(ls blnkfinance-blnk-typescript-*.tgz)
          mkdir smoke-test && cd smoke-test
          npm init -y >/dev/null 2>&1
          npm install "../${TARBALL}"
          node -e "require('@blnkfinance/blnk-typescript')"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
