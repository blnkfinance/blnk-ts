name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Type-check, unit tests, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Covers the compile-time contract tests under tests/unit/types.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Build package
        run: npm run compile

      - name: Run unit tests
        run: npx tap tests/unit --disable-coverage

      - name: Run linter
        run: npm run lint
